name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate & Architecture Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Architecture Invariants
        run: npm run verify:architecture

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npx eslint .

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build
