<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Pearlescent Core Star Symbol -->
  <g filter="url(#glow)">
    <!-- Central luminous 4-point star -->
    <path d="M 256 96 C 256 184 256 184 344 256 C 256 328 256 328 256 416 C 256 328 256 328 168 256 C 256 184 256 184 256 96 Z" fill="url(#pearl)"/>
    <!-- Center highlight -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
