[package]
name = "perlica-desktop"
version = "0.1.0"
description = "Perlica Personal Agent Desktop Shell"
authors = ["Perlica Team"]
edition = "2021"

[lib]
name = "perlica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
